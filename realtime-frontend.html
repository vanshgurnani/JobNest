<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Job Scraper</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  header {
    background: linear-gradient(135deg, #1e3a5f, #0f172a);
    padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #1e293b;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; }
  .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
  .panel {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 1.25rem; margin-bottom: 1rem;
  }
  .panel-title { font-size: .95rem; font-weight: 600; margin-bottom: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { font-size: .72rem; font-weight: 600; color: #64748b; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .03em; }
  .form-group input, .form-group select {
    width: 100%; padding: .55rem .75rem; border: 1px solid #334155; border-radius: 8px;
    font-size: .85rem; background: #0f172a; color: #e2e8f0; transition: border-color .2s;
  }
  .form-group input:focus { outline: none; border-color: #3b82f6; }
  .form-group input::placeholder { color: #475569; }
  .hint { font-size: .7rem; color: #475569; margin-top: .25rem; }

  .target-row { display: flex; gap: .5rem; margin-bottom: .75rem; }
  .target-row label { font-size: .72rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: .35rem; cursor: pointer; }
  .target-row input[type="radio"] { accent-color: #3b82f6; }

  .controls { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; }
  .btn {
    padding: .6rem 1.5rem; border: none; border-radius: 8px; font-size: .85rem; font-weight: 600;
    cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: .5rem;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn-start { background: #16a34a; color: white; }
  .btn-start:hover:not(:disabled) { background: #15803d; transform: translateY(-1px); }
  .btn-stop { background: #dc2626; color: white; }
  .btn-stop:hover:not(:disabled) { background: #b91c1c; transform: translateY(-1px); }
  .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
  .btn-outline:hover:not(:disabled) { background: #1e293b; }

  .status-bar {
    display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    margin-bottom: 1rem; font-size: .85rem; min-height: 2.8rem;
  }
  .spinner { width: 1rem; height: 1rem; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg { flex: 1; }
  .status-progress { font-weight: 600; color: #3b82f6; flex-shrink: 0; }

  .progress-bar { height: 4px; background: #0f172a; border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 2px; transition: width .3s ease; width: 0%; }

  .log { max-height: 400px; overflow-y: auto; font-family: 'SFMono-Regular', Consolas, monospace; font-size: .78rem; line-height: 1.5; }
  .log::-webkit-scrollbar { width: 4px; }
  .log::-webkit-scrollbar-track { background: #0f172a; }
  .log::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  .log-entry { padding: .15rem 0; color: #64748b; }
  .log-entry.info { color: #93c5fd; }
  .log-entry.ok { color: #4ade80; }
  .log-entry.fail { color: #f87171; }
  .log-entry.done { color: #22d3ee; font-weight: 600; }
  .log-entry .ts { color: #475569; margin-right: .5rem; }

  .result-card {
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    margin-bottom: .5rem; overflow: hidden;
  }
  .result-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .6rem 1rem; cursor: pointer; font-size: .85rem;
  }
  .result-header:hover { background: #1e293b; }
  .result-header .arrow { transition: transform .2s; font-size: .7rem; margin-right: .5rem; }
  .result-card.open .result-header .arrow { transform: rotate(90deg); }
  .result-jobs { display: none; border-top: 1px solid #334155; }
  .result-card.open .result-jobs { display: block; }
  .job-row {
    padding: .5rem 1rem; border-bottom: 1px solid #1e293b; font-size: .8rem;
    display: flex; gap: .5rem; align-items: flex-start;
  }
  .job-row:last-child { border-bottom: none; }
  .job-title { font-weight: 600; color: #e2e8f0; }
  .job-loc { color: #64748b; font-size: .75rem; }
  .job-meta { color: #475569; font-size: .7rem; }

  .chip { font-size: .7rem; padding: .15rem .5rem; border-radius: 999px; font-weight: 600; }
  .chip-ok { background: rgba(22,163,74,.15); color: #4ade80; }
  .chip-fail { background: rgba(220,38,38,.15); color: #f87171; }
  .chip-zero { background: rgba(100,116,139,.15); color: #94a3b8; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .container { padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Real-Time Job Scraper</h1>
  <span style="font-size:.75rem;color:#475569;">v1</span>
</header>
<div class="container">
  <div class="panel">
    <div class="panel-title">Configuration</div>
    <div class="target-row">
      <label><input type="radio" name="targetMode" value="names" checked onchange="toggleMode()"> Company Names</label>
      <label><input type="radio" name="targetMode" value="url" onchange="toggleMode()"> Company URL</label>
    </div>
    <div class="form-grid">
      <div class="full" id="companiesGroup">
        <div class="form-group">
          <label for="companies">Companies</label>
          <input type="text" id="companies" placeholder="amazon, google, microsoft">
          <div class="hint">Comma-separated. Leave empty to scrape all supported.</div>
        </div>
      </div>
      <div class="full" id="urlGroup" style="display:none;">
        <div class="form-group">
          <label for="companyUrl">Company Career Page URL</label>
          <input type="url" id="companyUrl" placeholder="https://careers.bcg.com/global/en/search-results">
          <div class="hint">Single company career page URL.</div>
        </div>
      </div>
      <div class="form-group">
        <label for="keyword">Keyword</label>
        <input type="text" id="keyword" placeholder="e.g. engineer">
      </div>
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Bangalore">
      </div>
      <div class="form-group">
        <label for="pages">Pages</label>
        <input type="number" id="pages" value="2" min="1" max="10">
      </div>
      <div class="form-group">
        <label for="pageSize">Per Page</label>
        <input type="number" id="pageSize" value="20" min="1" max="100">
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-start" id="startBtn" onclick="startScrape()">Start Scrape</button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopScrape()" disabled>Stop</button>
      <button class="btn btn-outline" id="pushBtn" onclick="pushToDb()" disabled>Push to DB</button>
      <button class="btn btn-outline" onclick="clearAll()">Clear</button>
      <label style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:#94a3b8;cursor:pointer;margin-left:auto;">
        <input type="checkbox" id="saveToDb" style="accent-color:#16a34a;" onchange="toggleSaveToDb()">
        Auto-save to DB
      </label>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="status-bar" id="statusBar">
    <div class="spinner" id="spinner" style="display:none;"></div>
    <span class="status-msg" id="statusMsg">Ready</span>
    <span class="status-progress" id="statusProgress"></span>
  </div>

  <div class="panel">
    <div class="panel-title">Log</div>
    <div class="log" id="logArea"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div class="panel-title">Results <span class="total-badge" id="totalBadge" style="font-weight:400;color:#64748b;margin-left:.5rem;"></span></div>
    <div id="resultsArea"></div>
  </div>
</div>

<script>
let currentTaskId = null;
let eventSource = null;

function toggleMode() {
  const mode = document.querySelector('input[name="targetMode"]:checked').value;
  document.getElementById('companiesGroup').style.display = mode === 'names' ? '' : 'none';
  document.getElementById('urlGroup').style.display = mode === 'url' ? '' : 'none';
}

function log(type, msg) {
  const area = document.getElementById('logArea');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const ts = new Date().toLocaleTimeString();
  entry.innerHTML = `<span class="ts">[${ts}]</span>${msg}`;
  area.appendChild(entry);
  area.scrollTop = area.scrollHeight;
  const consoleFn = type === 'fail' ? console.error : type === 'ok' || type === 'done' ? console.log : console.log;
  consoleFn(`[${ts}] [${type.toUpperCase()}] ${msg.replace(/<[^>]+>/g, '')}`);
}

function toggleSaveToDb() {
  const on = document.getElementById('saveToDb').checked;
  log('info', `Auto-save to DB ${on ? 'enabled' : 'disabled'}`);
}

let lastResults = [];

async function pushToDb() {
  if (!lastResults.length) return;
  const allJobs = lastResults.flatMap(r => r.jobs || []);
  const btn = document.getElementById('pushBtn');
  btn.disabled = true;
  log('info', `Pushing ${allJobs.length} jobs to database...`);
  try {
    const res = await fetch('http://127.0.0.1:8000/push-to-db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobs: allJobs }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    log('ok', `Pushed ${data.saved} jobs to database`);
  } catch (e) {
    log('fail', `Push to DB failed: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = Math.round(pct * 100) + '%';
}

async function startScrape() {
  const mode = document.querySelector('input[name="targetMode"]:checked').value;
  const saveToDb = document.getElementById('saveToDb').checked;
  const body = {
    companies: mode === 'names' ? document.getElementById('companies').value : '',
    company_url: mode === 'url' ? document.getElementById('companyUrl').value : '',
    keyword: document.getElementById('keyword').value,
    location: document.getElementById('location').value,
    pages: parseInt(document.getElementById('pages').value) || 2,
    page_size: parseInt(document.getElementById('pageSize').value) || 20,
    delay_seconds: 0.5,
    save_to_db: saveToDb,
  };

  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('pushBtn').disabled = true;
  document.getElementById('spinner').style.display = '';
  document.getElementById('statusMsg').textContent = 'Starting...';
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('logArea').innerHTML = '';
  lastResults = [];
  setProgress(0);

  log('info', `Starting scrape | mode=${mode} | save_to_db=${saveToDb}`);
  log('info', `Config: ${JSON.stringify({ ...body, companies: body.companies || undefined, company_url: body.company_url || undefined })}`);

  try {
    const res = await fetch('http://127.0.0.1:8000/scrape/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    currentTaskId = data.task_id;
    log('info', `Task started: ${currentTaskId}`);
    connectSSE(currentTaskId);
  } catch (e) {
    log('fail', `Failed to start: ${e.message}`);
    document.getElementById('statusMsg').textContent = 'Error: ' + e.message;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('spinner').style.display = 'none';
  }
}

function connectSSE(taskId) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`http://127.0.0.1:8000/scrape/events/${taskId}`);

  eventSource.onopen = function() {
    log('ok', 'SSE connected');
  };

  eventSource.onmessage = function(e) {
    const data = JSON.parse(e.data);
    handleEvent(data);
  };

  eventSource.onerror = function() {
    log('warn', 'SSE connection lost — switching to polling');
    // Try polling as fallback when SSE fails
    eventSource.close();
    pollTask(taskId);
  };
}

let pollTimer = null;

function pollTask(taskId) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`http://127.0.0.1:8000/scrape/status/${taskId}`);
      const data = await res.json();
      handleEvent(data);
      if (['completed', 'cancelled', 'failed'].includes(data.status)) {
        clearInterval(pollTimer);
      }
    } catch (e) {
      clearInterval(pollTimer);
    }
  }, 1000);
}

function handleEvent(data) {
  const statusMsg = document.getElementById('statusMsg');
  const statusProgress = document.getElementById('statusProgress');

  if (data.status === 'running') {
    document.getElementById('spinner').style.display = '';
    statusMsg.textContent = data.message || 'Running...';
    statusProgress.textContent = data.progress > 0 ? Math.round(data.progress * 100) + '%' : '';
    setProgress(data.progress);
  } else if (data.status === 'completed') {    document.getElementById('spinner').style.display = 'none';
    statusMsg.textContent = data.message || 'Completed';
    statusProgress.textContent = '100%';
    setProgress(1);
    log('done', `Completed — ${data.total} total jobs`);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('pushBtn').disabled = !(data.results && data.results.length);
    showResults(data.results, data.total);
    if (data.results) {
      lastResults = data.results;
      const pushed = data.results.filter(r => r.saved_to_db);
      if (pushed.length) {
        log('ok', `Auto-save complete — ${pushed.map(r => r.target + ':' + r.saved_to_db).join(', ')}`);
      }
    }
    if (eventSource) eventSource.close();
    if (pollTimer) clearInterval(pollTimer);
  } else if (data.status === 'cancelled') {
    document.getElementById('spinner').style.display = 'none';
    statusMsg.textContent = 'Cancelled';
    statusProgress.textContent = '';
    log('fail', 'Cancelled by user');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  } else if (data.status === 'failed') {
    document.getElementById('spinner').style.display = 'none';
    statusMsg.textContent = 'Failed: ' + (data.error || 'Unknown error');
    statusProgress.textContent = '';
    log('fail', 'Failed: ' + (data.error || 'Unknown error'));
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }

  // Log progress messages
  if (data.message && !data.message.startsWith('[')) {
    log('info', data.message);
  }
}

function logEvent(raw) {
  try {
    log('info', 'Event: ' + raw);
  } catch (e) { /* ignore */ }
}

async function stopScrape() {
  if (!currentTaskId) return;
  document.getElementById('stopBtn').disabled = true;
  try {
    await fetch(`http://127.0.0.1:8000/scrape/stop/${currentTaskId}`, { method: 'POST' });
  } catch (e) {
    log('fail', 'Stop request failed: ' + e.message);
  }
}

function showResults(results, total) {
  if (!results || results.length === 0) return;
  const panel = document.getElementById('resultsPanel');
  const area = document.getElementById('resultsArea');
  area.innerHTML = '';
  panel.style.display = '';
  document.getElementById('totalBadge').textContent = `${total} jobs from ${results.length} targets`;

  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'result-card';

    const jobs = r.jobs || [];
    const chipClass = r.error ? 'chip-fail' : (jobs.length === 0 ? 'chip-zero' : 'chip-ok');
    const chipText = r.error ? 'Error' : `${jobs.length} jobs`;

    const header = document.createElement('div');
    header.className = 'result-header';
    header.innerHTML = `<span><span class="arrow">&#9654;</span> ${esc(r.target)}</span><span class="chip ${chipClass}">${chipText}</span>`;
    header.onclick = () => card.classList.toggle('open');
    card.appendChild(header);

    if (r.error) {
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'padding:.5rem 1rem;color:#f87171;font-size:.8rem;';
      errDiv.textContent = r.error;
      card.appendChild(errDiv);
    } else if (jobs.length > 0) {
      const list = document.createElement('div');
      list.className = 'result-jobs';
      jobs.forEach(j => {
        const row = document.createElement('div');
        row.className = 'job-row';
        const loc = j.location || '—';
        row.innerHTML = `<div><div class="job-title">${esc(j.title)}</div><div class="job-loc">${esc(loc)}</div></div>`;
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    area.appendChild(card);
  });
}

function clearAll() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  currentTaskId = null;
  lastResults = [];
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('statusMsg').textContent = 'Ready';
  document.getElementById('statusProgress').textContent = '';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('pushBtn').disabled = true;
  document.getElementById('spinner').style.display = 'none';
  setProgress(0);
  log('info', 'Cleared');
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
</body>
</html>
