version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: job_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: job_intelligence
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: job_api
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: job_intelligence
      GO_CRAWLER_URL: http://crawler:8081
      CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN:?Set CRAWLER_API_TOKEN in .env}
    depends_on:
      mongodb:
        condition: service_healthy
      crawler:
        condition: service_started

  crawler:
    build:
      context: ./crawler-go
    container_name: jobnest_go_crawler
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: job_intelligence
      CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN}
      CRAWLER_ADDR: :8081
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
