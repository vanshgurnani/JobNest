<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scraper</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f1f5f9; color: #0f172a;
  }
  header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white; padding: 1.25rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 12px rgba(30,64,175,.25);
  }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  .badge {
    font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: .3rem .75rem; border-radius: 999px;
  }
  .badge-local { background: #dbeafe; color: #1e40af; }
  .badge-db { background: #dcfce7; color: #166534; }
  .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  .panel {
    background: white; border-radius: 12px; padding: 1.75rem;
    margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .panel-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; color: #0f172a; }

  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label {
    font-size: .78rem; font-weight: 600; color: #475569;
    margin-bottom: .35rem; letter-spacing: .01em;
  }
  .form-group input, .form-group select {
    width: 100%; padding: .6rem .85rem; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: .875rem; background: #fafbfc;
    transition: all .2s; color: #0f172a;
  }
  .form-group input:hover, .form-group select:hover { border-color: #93c5fd; background: white; }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: #3b82f6; background: white;
    box-shadow: 0 0 0 4px rgba(59,130,246,.1);
  }
  .form-group input::placeholder { color: #94a3b8; }
  .hint { font-size: .72rem; color: #94a3b8; margin-top: .3rem; }

  .mode-toggle {
    display: flex; gap: 0; background: #f1f5f9; border-radius: 10px;
    padding: 3px; width: fit-content; border: 1px solid #e2e8f0;
    margin-top: .25rem;
  }
  .mode-toggle input { display: none; }
  .mode-toggle label {
    padding: .45rem 1.1rem; border-radius: 8px; font-size: .82rem;
    font-weight: 600; cursor: pointer; transition: all .2s;
    color: #64748b; user-select: none;
  }
  .mode-toggle input:checked + label {
    background: white; color: #1e40af; box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .mode-toggle label:first-of-type { border-radius: 8px 0 0 8px; }
  .mode-toggle label:last-of-type { border-radius: 0 8px 8px 0; }

  .actions { display: flex; gap: .75rem; align-items: center; margin-top: 1.25rem; }
  .btn-primary {
    padding: .65rem 1.75rem; background: #3b82f6; color: white; border: none;
    border-radius: 10px; font-size: .875rem; font-weight: 600; cursor: pointer;
    transition: all .15s; display: inline-flex; align-items: center; gap: .5rem;
  }
  .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-outline {
    padding: .65rem 1.5rem; background: white; color: #475569; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: .875rem; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }

  .status-bar {
    display: none; align-items: center; gap: .75rem;
    padding: .85rem 1.1rem; background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 10px; margin-bottom: 1rem; font-size: .875rem;
  }
  .status-bar.show { display: flex; }
  .spinner {
    width: 1.1rem; height: 1.1rem; border: 2px solid #bfdbfe;
    border-top-color: #3b82f6; border-radius: 50%;
    animation: spin .6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { color: #1e40af; font-weight: 500; }
  .status-count { margin-left: auto; font-weight: 600; color: #1e40af; }

  .error-box {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1rem;
    font-size: .875rem; display: none; font-weight: 500;
  }
  .error-box.show { display: block; }

  .summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: .75rem; margin-bottom: 1.25rem;
  }
  .summary-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 1rem .75rem; text-align: center;
  }
  .summary-card .num { font-size: 1.6rem; font-weight: 700; color: #3b82f6; line-height: 1.2; }
  .summary-card .label { font-size: .72rem; color: #64748b; margin-top: .2rem; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }

  .company-result {
    background: white; border: 1px solid #e2e8f0; border-radius: 10px;
    margin-bottom: .75rem; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .company-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .8rem 1.1rem; background: #fafbfc;
    cursor: pointer; transition: background .15s;
    border-bottom: 1px solid transparent;
  }
  .company-header:hover { background: #f1f5f9; }
  .company-header h3 { font-size: .9rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
  .company-header .arrow { font-size: .7rem; color: #94a3b8; transition: transform .2s; }
  .company-result.open .company-header .arrow { transform: rotate(90deg); }
  .company-header .chip {
    font-size: .72rem; padding: .2rem .65rem; border-radius: 999px;
    font-weight: 600; letter-spacing: .01em;
  }
  .chip-ok { background: #dcfce7; color: #166534; }
  .chip-fail { background: #fef2f2; color: #b91c1c; }
  .chip-zero { background: #f1f5f9; color: #64748b; }
  .chip-db { background: #dbeafe; color: #1e40af; margin-left: .4rem; font-size: .65rem; }

  .job-list { display: none; border-top: 1px solid #e2e8f0; }
  .company-result.open .job-list { display: block; }
  .job-item {
    padding: .75rem 1.1rem; border-bottom: 1px solid #f1f5f9;
    display: grid; grid-template-columns: 1fr auto;
    gap: .35rem .75rem; font-size: .875rem;
  }
  .job-item:last-child { border-bottom: none; }
  .job-item .title { font-weight: 600; color: #0f172a; }
  .job-item .company { color: #3b82f6; font-size: .8rem; font-weight: 500; }
  .job-item .meta { color: #64748b; font-size: .78rem; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
  .job-item .apply-link {
    font-size: .78rem; color: #3b82f6; text-decoration: none; font-weight: 600;
    padding: .2rem .6rem; border: 1px solid #bfdbfe; border-radius: 6px;
    transition: all .15s; align-self: center;
  }
  .job-item .apply-link:hover { background: #eff6ff; text-decoration: none; }

  .target-error { padding: .75rem 1.1rem; color: #b91c1c; font-size: .82rem; }

  @media (max-width: 640px) {
    .container { padding: 1rem; }
    .form-grid { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr 1fr; }
    header { padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Job Scraper</h1>
  <span class="badge badge-local" id="headerBadge">Local</span>
</header>

<div class="container">
  <div class="panel">
    <div class="panel-title">Scrape Configuration</div>
    <form id="scrapeForm">
      <div class="form-grid">
        <div class="full">
          <div class="form-group">
            <label for="companies">Companies</label>
            <input type="text" id="companies" placeholder="amazon, google, microsoft">
            <div class="hint">Comma-separated company names. Leave empty to scrape all supported companies.</div>
          </div>
        </div>
        <div class="form-group">
          <label for="keyword">Keyword</label>
          <input type="text" id="keyword" placeholder="e.g. engineer">
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g. Bangalore">
        </div>
        <div class="form-group">
          <label for="pages">Pages per Company</label>
          <input type="number" id="pages" value="2" min="1" max="10">
        </div>
        <div class="form-group">
          <label for="pageSize">Jobs per Page</label>
          <input type="number" id="pageSize" value="20" min="1" max="100">
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn-primary" id="scrapeBtn">Start Scrape</button>
        <button type="button" class="btn-outline" id="clearBtn">Clear</button>
        <div style="margin-left: auto; display: flex; align-items: center; gap: .75rem;">
          <div style="display: flex; align-items: center; gap: .35rem;">
            <input type="checkbox" id="usePlaywright" style="accent-color:#3b82f6;width:1rem;height:1rem;cursor:pointer">
            <label for="usePlaywright" style="font-size:.78rem;font-weight:600;color:#64748b;cursor:pointer">Playwright</label>
          </div>
          <div style="display: flex; align-items: center; gap: .5rem;">
            <span style="font-size: .78rem; font-weight: 600; color: #64748b;">Mode</span>
            <div class="mode-toggle">
              <input type="radio" name="mode" id="modeLocal" value="local" checked>
              <label for="modeLocal">Local</label>
              <input type="radio" name="mode" id="modeDb" value="db">
              <label for="modeDb">DB</label>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span class="status-text" id="statusText">Working...</span>
    <span class="status-count" id="statusCount"></span>
  </div>

  <div id="resultsArea"></div>
</div>

<script>
document.querySelectorAll('input[name="mode"]').forEach(el => {
  el.addEventListener('change', () => {
    const badge = document.getElementById('headerBadge');
    if (document.getElementById('modeDb').checked) {
      badge.textContent = 'DB';
      badge.className = 'badge badge-db';
    } else {
      badge.textContent = 'Local';
      badge.className = 'badge badge-local';
    }
  });
});

async function scrape() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const data = {
    companies: document.getElementById('companies').value,
    keyword: document.getElementById('keyword').value,
    location: document.getElementById('location').value,
    pages: parseInt(document.getElementById('pages').value) || 2,
    page_size: parseInt(document.getElementById('pageSize').value) || 20,
    delay_seconds: 0.5,
    mode: mode,
    playwright: document.getElementById('usePlaywright').checked,
  };

  const btn = document.getElementById('scrapeBtn');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const statusCount = document.getElementById('statusCount');
  const errorBox = document.getElementById('errorBox');
  const resultsArea = document.getElementById('resultsArea');

  errorBox.classList.remove('show');
  resultsArea.innerHTML = '';

  btn.disabled = true;
  btn.textContent = 'Scraping...';
  statusBar.classList.add('show');
  const pw = document.getElementById('usePlaywright').checked;
  statusText.textContent = mode === 'db' ? 'Scraping & storing to DB...' : (pw ? 'Scraping with Playwright...' : 'Scraping...');
  statusCount.textContent = '';

  try {
      const res = await fetch('http://localhost:8000/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(text || `Server error (${res.status})`);
    }

    const result = await res.json();
    renderResults(result, mode);
  } catch (e) {
    errorBox.textContent = e.message || 'Scrape failed';
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Start Scrape';
    statusBar.classList.remove('show');
  }
}

function renderResults(result, mode) {
  const area = document.getElementById('resultsArea');
  const results = result.results || [];
  const total = result.total || 0;

  let ok = 0, fail = 0, empty = 0;
  results.forEach(r => {
    if (r.error) { fail++; }
    else if (r.count === 0) { empty++; }
    else { ok++; }
  });

  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `
    <div class="summary-card"><div class="num">${total}</div><div class="label">Total Jobs</div></div>
    <div class="summary-card"><div class="num">${results.length}</div><div class="label">Targets</div></div>
    ${ok ? `<div class="summary-card"><div class="num" style="color:#16a34a">${ok}</div><div class="label">Successful</div></div>` : ''}
    ${fail ? `<div class="summary-card"><div class="num" style="color:#dc2626">${fail}</div><div class="label">Failed</div></div>` : ''}
    ${empty ? `<div class="summary-card"><div class="num" style="color:#64748b">${empty}</div><div class="label">No Results</div></div>` : ''}
  `;
  area.appendChild(summary);

  results.forEach(r => {
    const box = document.createElement('div');
    box.className = 'company-result';

    const jobs = r.jobs || [];
    const header = document.createElement('div');
    header.className = 'company-header';

    const chipClass = r.error ? 'chip-fail' : (jobs.length === 0 ? 'chip-zero' : 'chip-ok');
    const chipText = r.error ? 'Error' : `${jobs.length} jobs`;
    const dbTag = mode === 'db' && !r.error && jobs.length > 0 ? '<span class="chip chip-db">saved</span>' : '';

    header.innerHTML = `<h3><span class="arrow">&#9654;</span> ${esc(r.target)} ${dbTag}</h3><span class="chip ${chipClass}">${chipText}</span>`;
    header.onclick = () => box.classList.toggle('open');
    box.appendChild(header);

    if (r.error) {
      const errDiv = document.createElement('div');
      errDiv.className = 'target-error';
      errDiv.textContent = r.error;
      box.appendChild(errDiv);
    } else if (jobs.length > 0) {
      const list = document.createElement('div');
      list.className = 'job-list';
      jobs.forEach(j => {
        const item = document.createElement('div');
        item.className = 'job-item';
        const url = j.apply_url || j.url || '';
        const loc = j.location || '—';
        const date = j.posted_date
          ? new Date(j.posted_date).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' })
          : '—';
        const skills = (j.skills || []).slice(0, 4);
        item.innerHTML = `
          <div>
            <div class="title">${esc(j.title)}</div>
            <div class="company">${esc(j.company)}</div>
          </div>
          ${url ? `<a class="apply-link" href="${esc(url)}" target="_blank" rel="noopener">Apply &rarr;</a>` : ''}
          <div class="meta">
            <span>&#128205; ${esc(loc)}</span>
            <span>&#128197; ${date}</span>
            ${j.employment_type ? `<span>${esc(j.employment_type)}</span>` : ''}
            ${j.experience ? `<span>${esc(j.experience)}</span>` : ''}
            ${skills.length ? `<span>Skills: ${esc(skills.join(', '))}</span>` : ''}
          </div>
        `;
        list.appendChild(item);
      });
      box.appendChild(list);
    }

    area.appendChild(box);
  });
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

document.getElementById('scrapeForm').addEventListener('submit', e => { e.preventDefault(); scrape(); });
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('errorBox').classList.remove('show');
});
</script>
</body>
</html>
